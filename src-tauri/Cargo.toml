[package]
name = "extracted"
version = "0.1.0"
description = "A native desktop archive extraction utility"
authors = ["Extracted contributors"]
edition = "2021"

[lib]
name = "extracted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
sevenz-rust2 = { version = "0.25", features = ["util"] }